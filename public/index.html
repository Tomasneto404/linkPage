<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkPage</title>
  <link rel="icon" id="favicon" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .tabs-wrap {
      position: sticky;
      top: var(--header-h);
      background: rgba(255,255,255,0.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 40;
      transition: background var(--transition);
    }
    [data-theme="dark"] .tabs-wrap { background: rgba(28,28,30,0.85); }

    .tabs {
      max-width: 1120px;
      margin: 0 auto;
      padding: 8px 22px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 980px;
      border: 1px solid transparent;
      background: none;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition);
      letter-spacing: -0.01em;
    }
    .tab:hover { background: var(--surface-3); color: var(--text); }
    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tab-count {
      font-size: 0.72rem;
      opacity: 0.75;
      font-weight: 600;
    }
    .tab-lock {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
      opacity: 0.75;
    }
    .tab.active .tab-lock { opacity: 1; }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 22px 64px;
    }

    .link-card { text-decoration: none; display: flex; }
    .link-card:hover { text-decoration: none; }

    .link-arrow {
      flex-shrink: 0;
      color: var(--text-muted);
      opacity: 0;
      align-self: center;
      transition: opacity var(--transition), transform var(--transition);
    }
    .link-card:hover .link-arrow { opacity: 1; transform: translateX(3px); }

    /* Copy-link button — appears on card hover, swaps to a check mark for
       ~1.3 s after a successful copy. Stays clickable without triggering the
       card's parent <a> navigation (handled via stopPropagation in JS). */
    .link-copy-btn {
      flex-shrink: 0;
      align-self: center;
      width: 30px;
      height: 30px;
      margin-right: 4px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--transition), background var(--transition),
                  border-color var(--transition), color var(--transition),
                  transform var(--transition);
      position: relative;
    }
    .link-card:hover .link-copy-btn,
    .link-copy-btn:focus-visible { opacity: 1; }
    .link-copy-btn:hover {
      background: var(--surface-3);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .link-copy-btn:active { transform: scale(0.94); }
    .link-copy-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0,113,227,0.18);
    }

    /* Stack the two icons in the same slot; toggle with a class so the swap
       is a clean cross-fade rather than an innerHTML rewrite. */
    .link-copy-icon, .link-copy-check {
      position: absolute;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .link-copy-check { opacity: 0; transform: scale(0.7); color: #30b558; }
    [data-theme="dark"] .link-copy-check { color: #30d158; }

    .link-copy-btn.is-copied .link-copy-icon  { opacity: 0; transform: scale(0.7); }
    .link-copy-btn.is-copied .link-copy-check { opacity: 1; transform: scale(1);   }
    .link-copy-btn.is-copied {
      opacity: 1 !important;
      border-color: rgba(48, 209, 88, 0.4);
      background: rgba(48, 209, 88, 0.10);
    }

    .link-copy-btn.is-failed {
      opacity: 1 !important;
      border-color: rgba(225, 29, 72, 0.45);
      background: rgba(225, 29, 72, 0.10);
      color: var(--danger, #e11d48);
    }

    /* Touch screens never get hover — always show the button so it can be
       tapped. Slightly larger touch target too. */
    @media (hover: none) {
      .link-copy-btn { opacity: 0.55; width: 34px; height: 34px; }
      .link-copy-btn:hover { opacity: 1; }
    }

    /* ─── Toast notifications ─────────────────────────────────────────── */

    .toast-container {
      position: fixed;
      top: calc(var(--header-h) + 14px);
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
      pointer-events: none;
    }

    @keyframes toastIn  { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { from { opacity: 1; transform: none; }            to { opacity: 0; transform: translateX(16px); } }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-left-width: 3px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      font-size: 0.875rem;
      color: var(--text);
      max-width: 320px;
      pointer-events: all;
      cursor: pointer;
      animation: toastIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .toast.removing       { animation: toastOut 0.18s ease both; }
    .toast-success        { border-left-color: #34c759; }
    .toast-error          { border-left-color: var(--danger, #e11d48); }
    .toast-info           { border-left-color: var(--primary); }
    .toast-icon           { flex-shrink: 0; display: flex; }
    .toast-success .toast-icon { color: #34c759; }
    .toast-error   .toast-icon { color: var(--danger, #e11d48); }
    .toast-info    .toast-icon { color: var(--primary); }
    .toast-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: rtl;            /* truncate from the start, keep the tail */
      text-align: left;
    }
    .toast-stack {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    @media (max-width: 720px) {
      .toast-container { right: 10px; left: 10px; }
      .toast { max-width: 100%; }
    }

    .admin-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 980px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .admin-btn:hover { background: var(--surface-3); color: var(--text); border-color: transparent; }

    /* Push theme + admin buttons to the right edge of the header,
       which lines up with the right edge of the third card in the grid
       (both containers share max-width:1120px and 22px side padding). */
    header .theme-toggle { margin-left: auto; }

    /* ── Mobile tweaks ─────────────────────────────────────────────────────── */
    @media (max-width: 720px) {
      .tabs { padding: 8px 14px; }
      main  { padding: 18px 14px 56px; }
    }
    @media (max-width: 480px) {
      .tabs { padding: 8px 10px; gap: 4px; }
      .tab  { padding: 5px 11px; font-size: 0.8125rem; }
      main  { padding: 14px 10px 56px; }

      /* Compact the right-edge buttons; show only the icon on the admin link */
      .admin-btn        { padding: 6px 9px; gap: 4px; }
      .admin-btn-label  { display: none; }
    }
</style>
</head>
<body>

<!-- Public password gate — shown by app.js if a password is configured -->
<div class="gate hidden" id="publicGate">
  <div class="gate-card">
    <div class="gate-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>Protected</h1>
    <p>Enter the password to view links.</p>
    <form id="publicGateForm">
      <input type="password" id="publicPasswordInput"
             placeholder="Enter password…" autocomplete="current-password" required />
      <div class="form-error hidden" id="publicGateError">Incorrect password.</div>
      <button type="submit" class="btn btn-primary gate-submit">View Links</button>
    </form>
  </div>
</div>

<header>
  <div class="header-inner">
    <a class="logo" id="headerLogo" href="/" aria-label="Go to home">
      <img id="brandImg" class="logo-img hidden" alt="Logo" />
      <span id="brandText" style="display:flex;align-items:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        LinkPage
      </span>
    </a>

    <div class="search-wrap" id="searchWrap" style="flex:1;max-width:380px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <div class="search-chips" id="searchChips" aria-label="Active filters"></div>
      <input class="search-input" id="searchInput" type="search"
             placeholder="Search links, groups, sections…"
             autocomplete="off" />
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg id="iconMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <a href="/admin" class="admin-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span class="admin-btn-label">Admin</span>
    </a>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-group="all">All</button>
  </div>
</div>

<main>
  <div class="empty-state hidden" id="emptyState">
    <div class="empty-icon" id="emptyIcon"></div>
    <p class="empty-title" id="emptyMsg"></p>
    <p class="empty-sub hidden" id="emptySubtext"></p>
  </div>
  <div class="links-grid" id="linksGrid"></div>
</main>

<!-- ════════════════════════════════════════════════
     GROUP UNLOCK MODAL
     Shown when a user clicks a password-protected group tab.
     ════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="unlockOverlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2>
        <span id="unlockGroupName">Locked group</span>
      </h2>
      <button type="button" class="modal-close" id="closeUnlockBtn" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6"  y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <form id="unlockForm" style="padding: 0 22px 22px">
      <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0 0 14px">
        This group is password-protected. Enter the password to view its links.
      </p>
      <div class="form-group">
        <input type="password" id="unlockPasswordInput"
               placeholder="Enter password…" autocomplete="current-password" required />
      </div>
      <div class="form-error hidden" id="unlockError">Wrong password.</div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelUnlockBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="unlockSubmitBtn">Unlock</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast notifications (e.g. "Link copied") -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
