name: Test, Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Pull requests are verified but never publish an image (see the build job's
  # event guard below).
  pull_request:
    branches:
      - main

jobs:
  # API test suite. The build job depends on this, so a red test never ships.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 matches the runtime in the Dockerfile (node:24-alpine), so the
      # tests exercise the same node:sqlite build that production uses.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

  build:
    # No green tests → no image.
    needs: test
    # Only publish for pushes to main and v* tags; a PR run stops after `test`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enables building for arm64 on the amd64 GitHub runner via QEMU emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags automatically:
      #   push to main      → tomasneto26/linkpage:latest
      #   push tag v1.2.3   → tomasneto26/linkpage:1.2.3 + tomasneto26/linkpage:latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tomasneto26/linkpage
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs using the GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
