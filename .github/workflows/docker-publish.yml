name: Test, Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Pull requests are verified but never publish an image (see the build job's
  # event guard below).
  pull_request:
    branches:
      - main

# Needed by the release job to create the GitHub Release for a v* tag.
permissions:
  contents: write

jobs:
  # API test suite. Everything downstream depends on this, so a red test never
  # ships an image and never cuts a release.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 matches the runtime in the Dockerfile (node:24-alpine), so the
      # tests exercise the same node:sqlite build that production uses.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      # Headless Chromium for the browser tests. A missing browser fails the
      # run here (CI is set), rather than skipping quietly as it does locally.
      - name: Install a headless browser
        run: npx playwright-core install --with-deps chromium-headless-shell

      - name: Run browser tests
        run: npm run test:browser

  # Trivy scans the lockfiles for CVEs and the Dockerfile for a vulnerable
  # base image. A single CRITICAL finding fails the job, which fails the build
  # job behind it — no image is pushed with a known critical vulnerability.
  # `ignore-unfixed` keeps the gate honest: it only trips on CVEs that have a
  # fix available, so an unfixable advisory does not permanently block releases.
  security:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan the repository for CVEs (package-lock.json, pnpm-lock.yaml)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          hide-progress: true

      - name: Scan the Dockerfile base image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: node:24-alpine
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          hide-progress: true

  # A release is nothing but a tag: everything else is derived. This job proves
  # the three sources agree before anything is published, so a mistyped tag
  # fails in seconds instead of shipping a mislabelled image.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag, package.json and CHANGELOG.md must agree
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"

          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version and re-tag."
            exit 1
          fi
          TAG_RE="$(printf '%s' "$TAG" | sed 's/\./\\./g')"
          if ! grep -qE "^## v?${TAG_RE}([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v$TAG' section. Write the release notes before tagging."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, security, verify-tag]
    # No green tests, a CRITICAL CVE in Trivy, or a mistyped tag → no image.
    # verify-tag is skipped on branch pushes, which must not block them — hence
    # the explicit result checks. A PR run stops after `test` + `security`.
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enables building for arm64 on the amd64 GitHub runner via QEMU emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags automatically:
      #   push to main      → tomasneto26/linkpage:latest
      #   push tag v1.2.3   → tomasneto26/linkpage:1.2.3 + tomasneto26/linkpage:1.2
      # `latest` tracks main only (is_default_branch), so a release means pushing
      # the merge to main *and* the tag — see "Releasing" in the README.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tomasneto26/linkpage
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build once for amd64 and keep it locally so Trivy can scan the real
      # image we are about to publish. Multi-platform push is a separate step
      # below that reuses the cache — same binary content, no extra build time
      # beyond the arm64 pass.
      - name: Build the amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: linkpage:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the built image for CVEs
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: linkpage:scan
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          hide-progress: true

      - name: Build and push the multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes the GitHub Release for a v* tag. The notes come straight out of
  # CHANGELOG.md — the same file the admin sidebar renders — so the in-app
  # update checker (which polls GitHub Releases) shows exactly what the admin
  # panel does. Runs last: no release without green tests and a pushed image.
  release:
    needs: [test, verify-tag, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract this version's section from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const lines = md.split(/\r?\n/);
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const start = lines.findIndex(l => new RegExp(`^## v?${escaped}\\b`).test(l));
            if (start < 0) { console.error(`no section for ${version}`); process.exit(1); }
            const rest = lines.slice(start + 1);
            const end = rest.findIndex(l => /^## /.test(l));
            const body = (end < 0 ? rest : rest.slice(0, end)).join("\n").trim();
            fs.writeFileSync("RELEASE_NOTES.md", body + "\n");
          '
          {
            echo ""
            echo "---"
            echo ""
            echo "### Docker"
            echo ""
            echo '```bash'
            echo "docker pull tomasneto26/linkpage:${VERSION}"
            echo '```'
          } >> RELEASE_NOTES.md
          echo "--- release notes ---"
          cat RELEASE_NOTES.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          # Idempotent: re-running the workflow for an existing tag updates the
          # release instead of failing.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --title "v${VERSION}" --notes-file RELEASE_NOTES.md
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file RELEASE_NOTES.md
          fi
